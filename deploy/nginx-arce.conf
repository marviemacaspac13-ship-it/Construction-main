# nginx site for ARCE. Copy to /etc/nginx/sites-available/arce and replace
# arce.example.com with your domain. certbot adds the HTTPS (443) block itself.
#
# The app and the API share one origin: the built frontend is served from
# /opt/arce/dist and /api/* is proxied to uvicorn on 127.0.0.1:8000. Because
# the browser never makes a cross-origin call, the localhost-only CORS list in
# backend/app/main.py does not need changing.
server {
    listen 80;
    listen [::]:80;
    server_name arce.example.com;

    root /opt/arce/dist;
    index index.html;

    # Plans are up to 25 MB; the multipart wrapper adds a little.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx gives up after 60 s by default. The slowest scan on one vCPU is a
        # plumbing scan whose Gemini models all fail: up to 100 s of Gemini, then
        # ~106 s reading labels locally (~206 s). A slower VPS core or two people
        # scanning at once can double that, so allow 600 s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # The pdf.js worker is an .mjs module; a browser refuses to run it unless it
    # is served as JavaScript, and older nginx mime.types has no mjs entry.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vite puts a content hash in every asset name, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is a React route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
